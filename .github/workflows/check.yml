name: Verificação do site

on:
  push:
    branches: [main]
  pull_request:

# Evita rodar duas vezes (push + PR) e cancela runs antigos do mesmo branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Construir o site (Astro)
        run: npm run build
      - name: Verificar páginas, links e JSON-LD
        run: node scripts/check.mjs
      - name: Verificar llms.txt/llms-full.txt contra o snapshot do quiosque
        run: node scripts/geo-build.mjs --check
      - name: Testes do sincronizador de fotos (scripts/fotos)
        working-directory: scripts/fotos
        run: npm ci --no-audit --no-fund && npm test
