name: Lighthouse (velocidade, SEO e acessibilidade)

# Mede /, /playground e /circuito a cada PR que mexe em página ou asset.
# Começa só avisando (warn); depois de algumas semanas de histórico, trocar para "error" no lighthouserc.json.
on:
  pull_request:
    paths: ['public/**', 'src/**', 'astro.config.mjs', 'lighthouserc.json']
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Construir o site (Astro)
        run: npm run build
      - name: Rodar Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
