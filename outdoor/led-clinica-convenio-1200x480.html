<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clínica Convênio · LED</title>
<!--
  Peça "Clínica · IASEP e PROASA", 10s, telão de LED 1200x480 (fachada do Parque Shopping).
  Só afirma o que a Clínica faz de fato: atende IASEP e PROASA e solicita a autorização da guia.
  Não diz que esta ou aquela terapia é coberta, e não usa os logos dos convênios (só os nomes).
  Faixa fixa igual à da peça de inauguração (logo da Clínica + Umarizal + WhatsApp animado).
  Linha da responsável técnica (nome + CRP) visível nos 10s.
  render(t) é função pura do tempo; ?t=4.2 congela um quadro.  MP4: node scripts/outdoor-render.mjs convenio
-->
<style>
  @font-face{font-family:'Fredoka';font-weight:300 700;src:url(../public/assets/fonts/fredoka-500.woff2) format('woff2');}
  :root{--amarelo:#FDC51D;--turquesa:#07C5C8;--rosa:#D61F4A;--petroleo:#065264;--petroleo-fundo:#043F4E;--creme:#FFF9F1;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:480px;overflow:hidden;background:var(--petroleo-fundo)}
  #palco{position:relative;width:1200px;height:480px;overflow:hidden;font-family:'Fredoka',sans-serif;font-weight:700}
  #cena{position:absolute;left:0;top:0;width:1200px;height:370px;overflow:hidden;
        background:radial-gradient(ellipse at 50% 30%,#0a6a80 0,var(--petroleo) 45%,var(--petroleo-fundo) 100%)}
  #raios{position:absolute;left:-700px;top:-1115px;width:2600px;height:2600px;border-radius:50%;opacity:0;
         background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 8deg,transparent 8deg 16deg)}
  .abs{position:absolute;left:0;top:0;will-change:transform}
  .txt{white-space:nowrap;line-height:1;paint-order:stroke fill}
  /* cena 1 */
  #linha{display:flex;align-items:center;gap:20px}
  #linha > *{will-change:transform;display:inline-block}
  .w{font-size:92px;color:var(--creme);text-shadow:0 7px 0 rgba(0,0,0,.35)}
  .chip{font-size:96px;color:var(--petroleo);border-radius:24px;padding:10px 30px 14px;box-shadow:0 9px 0 rgba(0,0,0,.35);
        border:6px solid var(--creme)}
  #cI{background:var(--amarelo)} #cP{background:var(--turquesa)}
  #carimbo{font-size:84px;color:var(--rosa);background:rgba(255,249,241,.96);border:11px solid var(--rosa);border-radius:20px;
           padding:4px 30px 9px;letter-spacing:3px;box-shadow:0 10px 0 rgba(0,0,0,.3)}
  /* cena 2 */
  #guia{width:210px;height:270px}
  #q{font-size:64px;color:var(--creme);text-shadow:0 6px 0 rgba(0,0,0,.35)}
  #r{font-size:118px;color:var(--amarelo);-webkit-text-stroke:12px var(--petroleo-fundo);text-shadow:0 9px 0 rgba(0,0,0,.35)}
  /* cena 3 */
  #cartao{background:var(--creme);border-radius:20px;padding:26px 34px;box-shadow:0 12px 0 rgba(0,0,0,.3)}
  #cartao img{width:720px;height:auto;display:block}
  .pilula{font-size:40px;border-radius:999px;padding:10px 28px}
  #p1{color:var(--petroleo);background:var(--amarelo)}
  #p2{color:var(--creme);border:4px solid var(--creme);font-weight:600}
  #rt{position:absolute;left:0;bottom:6px;width:1200px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:500;
      font-size:17px;color:rgba(255,249,241,.85);letter-spacing:.3px}
  #fx{position:absolute;left:0;top:0}
  /* faixa fixa (igual à peça de inauguração) */
  #faixa{position:absolute;overflow:visible;left:0;top:370px;width:1200px;height:110px;background:var(--creme);
         border-top:8px solid var(--turquesa);display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 28px}
  #faixa img{height:64px;width:auto;display:block}
  #contato{display:flex;align-items:center;gap:14px}
  #contato .a{font-size:26px;color:var(--rosa);text-align:right;line-height:1.05}
  #zap{position:relative;display:flex;align-items:center;gap:14px;background:var(--petroleo);color:var(--creme);
       border-radius:999px;padding:8px 28px 10px 16px;transform-origin:center;overflow:hidden}
  #zap .b{font-size:50px}
  #fone{display:block;transform-origin:50% 50%}
  #anel{position:absolute;border-radius:999px;border:5px solid var(--rosa);pointer-events:none}
  #zap-brilho{position:absolute;top:0;left:0;width:90px;height:100%;
              background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent)}
  #brilho{position:absolute;top:370px;left:0;width:140px;height:110px;
          background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:soft-light}
</style>
</head>
<body>
<div id="palco">
  <div id="cena">
    <div id="raios"></div>
    <canvas id="fx" width="1200" height="370"></canvas>
    <!-- cena 1 -->
    <div class="abs" id="linha">
      <span class="txt w" id="wTem">Tem</span>
      <span class="txt chip" id="cI">IASEP</span>
      <span class="txt w" id="wOu">ou</span>
      <span class="txt chip" id="cP">PROASA</span>
      <span class="txt w" id="wQ">?</span>
    </div>
    <div class="abs txt" id="carimbo">ATENDEMOS!</div>
    <!-- cena 2 -->
    <svg class="abs" id="guia" viewBox="0 0 210 270" style="overflow:visible">
      <path d="M14 6 h140 l46 46 v206 a8 8 0 0 1 -8 8 H14 a8 8 0 0 1 -8 -8 V14 a8 8 0 0 1 8 -8z" fill="#FFF9F1" stroke="#043F4E" stroke-width="4"/>
      <path d="M154 6 v38 a8 8 0 0 0 8 8 h38" fill="#d9e2e4" stroke="#043F4E" stroke-width="4"/>
      <text x="26" y="52" font-family="Fredoka" font-weight="700" font-size="34" fill="#065264">GUIA</text>
      <rect x="26" y="76" width="150" height="12" rx="6" fill="#bfcfd3"/><rect x="26" y="100" width="120" height="12" rx="6" fill="#bfcfd3"/>
      <rect x="26" y="124" width="140" height="12" rx="6" fill="#bfcfd3"/><rect x="26" y="148" width="96" height="12" rx="6" fill="#bfcfd3"/>
      <rect x="26" y="226" width="80" height="6" rx="3" fill="#065264"/>
      <g id="ok" transform="translate(150 200)">
        <circle r="54" fill="#07C5C8" stroke="#FFF9F1" stroke-width="8"/>
        <path d="M-24 2 l16 16 l32 -34" fill="none" stroke="#FFF9F1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="abs txt" id="q">Autorização da guia?</div>
    <div class="abs txt" id="r">A gente cuida.</div>
    <!-- cena 3 -->
    <div class="abs" id="cartao"><img src="../public/img/logo-clinica.png" alt="FaçaAmigos Centro de Terapia Comportamental"></div>
    <div class="abs txt pilula" id="p1">Atendemos IASEP e PROASA</div>
    <div class="abs txt pilula" id="p2">Terapia infantil · Umarizal</div>
    <div id="rt">Responsável técnica: Isabella Gonçalves Freitas · Psicóloga · CRP 10/4727</div>
  </div>
  <div id="faixa">
    <img src="../public/img/logo-clinica.png" alt="FaçaAmigos Centro de Terapia Comportamental">
    <div id="contato"><span class="txt a">Umarizal<br>WhatsApp</span>
      <div id="zap">
        <svg id="fone" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#FFF9F1"/>
          <path d="M17 11c1.4-.6 3 0 3.6 1.4l2 4.6c.5 1.2.2 2.6-.8 3.4l-2 1.7c1.3 2.9 3.6 5.2 6.5 6.6l1.7-2c.8-1 2.2-1.3 3.4-.8l4.6 2c1.4.6 2 2.2 1.4 3.6l-1 2.4c-.7 1.6-2.3 2.6-4 2.4C21.6 37.4 10.6 26.4 9.7 15.6c-.2-1.7.8-3.3 2.4-4z" fill="#065264"/></svg>
        <span class="txt b">(91) 99178-2027</span><div id="zap-brilho"></div>
      </div>
    </div>
    <div id="anel"></div>
  </div>
  <div id="brilho"></div>
</div>

<script>
const DUR = 10;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inCubic = (k) => k * k * k;
const outBack = (k, s = 1.7) => { const c = s + 1; return 1 + c * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const outElastic = (k) => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
function T(el, x, y, s = 1, r = 0, o = 1) { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; el.style.opacity = o; }

const R = rng(31);
const T_CARIMBO = 2.55;
const tinta = [...Array(26)].map(() => { const a = R() * Math.PI * 2, v = 160 + R() * 380;
  return { vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, r: 4 + R() * 9 }; });

const ctx = $('fx').getContext('2d');
// batida de "carimbo": cai de escala grande, bate e treme
const bate = (t, t0, dur = 0.2) => { const k = prog(t, t0, t0 + dur); return { k, s: k < 1 ? lerp(2.8, 1, k * k) : 1,
  tremor: k >= 1 ? Math.sin((t - t0 - dur) * 55) * 3 * (1 - prog(t, t0 + dur, t0 + dur + 0.3)) : 0 }; };

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  ctx.clearRect(0, 0, 1200, 370);

  /* ===== cena 1: "Tem IASEP ou PROASA?" + carimbo ATENDEMOS! (0 a 4s) ===== */
  const sai1 = outCubic(prog(t, 3.75, 4.05));
  const on1 = t < 4.1;
  $('linha').style.visibility = $('carimbo').style.visibility = on1 ? 'visible' : 'hidden';
  if (on1) {
    T($('linha'), $('linha')._x, 70 - sai1 * 330);
    const kT = outCubic(prog(t, 0.1, 0.35));
    T($('wTem'), 0, (1 - kT) * -40, 1, 0, kT);
    const bI = bate(t, 0.45), bP = bate(t, 1.0);
    T($('cI'), 0, 0, Math.max(0.001, bI.s), -3 + bI.tremor, bI.k > 0 ? 1 : 0);
    const kO = outCubic(prog(t, 0.8, 1.0));
    T($('wOu'), 0, 0, 1, 0, kO);
    T($('cP'), 0, 0, Math.max(0.001, bP.s), 3 + bP.tremor, bP.k > 0 ? 1 : 0);
    const kQ = outElastic(prog(t, 1.4, 1.9));
    T($('wQ'), 0, 0, Math.max(0.001, kQ), 8 + Math.sin(t * 6) * 6 * (t > 1.9 ? 1 : 0), kQ > 0 ? 1 : 0);
    // carimbo
    const bC = bate(t, T_CARIMBO, 0.18);
    T($('carimbo'), $('carimbo')._x, 222 - sai1 * 330, Math.max(0.001, bC.s), -4 + bC.tremor, bC.k > 0 ? 1 : 0);
    // respingos de tinta
    const dt = t - T_CARIMBO - 0.18;
    if (dt > 0 && dt < 0.6) for (const p of tinta) {
      ctx.fillStyle = `rgba(214,31,74,${0.9 * (1 - dt / 0.6)})`; ctx.beginPath();
      ctx.arc(600 + p.vx * dt, 270 + p.vy * dt, p.r * (1 - dt), 0, Math.PI * 2); ctx.fill(); }
  }
  $('raios').style.opacity = clamp(prog(t, 2.6, 2.9) - prog(t, 3.8, 4.1)) + clamp(prog(t, 6.3, 6.7));
  $('raios').style.transform = `rotate(${t * 10}deg)`;

  /* ===== cena 2: "Autorização da guia? A gente cuida." (4 a 6,3s) ===== */
  const on2 = t >= 3.9 && t < 6.45, sai2 = outCubic(prog(t, 6.1, 6.4));
  for (const id of ['guia', 'q', 'r']) $(id).style.visibility = on2 ? 'visible' : 'hidden';
  if (on2) {
    const kg = outBack(prog(t, 3.95, 4.4));
    T($('guia'), lerp(-260, 70, kg), 40 - sai2 * 380, 1, lerp(-20, -5, kg));
    const ko = prog(t, 4.75, 4.93);
    $('ok').setAttribute('transform', `translate(150 200) scale(${ko < 1 ? lerp(2.6, 1, ko * ko) : 1 + Math.sin((t - 4.93) * 40) * 0.04 * (1 - prog(t, 4.93, 5.2))}) rotate(-8)`);
    $('ok').style.opacity = ko > 0 ? 1 : 0;
    const kq = outCubic(prog(t, 4.15, 4.45));
    T($('q'), $('q')._x, lerp(20, 58, kq) - sai2 * 380, 1, -2, kq);
    const kr = bate(t, 4.75, 0.2);
    T($('r'), $('r')._x, 150 - sai2 * 380, Math.max(0.001, kr.s), -3 + kr.tremor, kr.k > 0 ? 1 : 0);
  }

  /* ===== cena 3: assinatura (6,4 a 10s) ===== */
  const kc = outBack(prog(t, 6.4, 6.9), 1.4);
  T($('cartao'), $('cartao')._x, 34, Math.max(0.001, kc), 0, t > 6.4 ? 1 : 0);
  const k1 = outBack(prog(t, 6.95, 7.3)), k2 = outBack(prog(t, 7.15, 7.5));
  T($('p1'), $('p1')._x, 236, Math.max(0.001, k1), -2, k1 > 0 ? 1 : 0);
  T($('p2'), $('p2')._x, 236, Math.max(0.001, k2), 0, k2 > 0 ? 1 : 0);

  $('brilho').style.transform = `translateX(${((t % 5) / 5) * 1700 - 200}px)`;

  /* WhatsApp chamativo (igual à peça de inauguração): pulso 1 Hz, fundo petróleo/rosa, anel, telefone tocando */
  const fb = t % 1, par = Math.floor(t) % 2 === 0, pulso = Math.exp(-fb * 5);
  const zap = $('zap');
  zap.style.transform = `scale(${1 + 0.05 * pulso})`;
  zap.style.background = par ? '#065264' : '#D61F4A';
  zap.style.boxShadow = `0 6px 0 ${par ? '#033845' : '#9c1235'}`;
  const toca = fb < 0.45 ? Math.sin(fb * 70) * 16 * (1 - fb / 0.45) : 0;
  $('fone').style.transform = `rotate(${toca}deg)`;
  $('fone').querySelector('path').setAttribute('fill', par ? '#065264' : '#D61F4A');
  const anel = $('anel'), r = $('zap')._r, cresce = fb * 26;
  anel.style.left = (r.x - cresce) + 'px'; anel.style.top = (r.y - cresce) + 'px';
  anel.style.width = (r.w + cresce * 2) + 'px'; anel.style.height = (r.h + cresce * 2) + 'px';
  anel.style.opacity = (1 - fb) * 0.9; anel.style.borderColor = par ? '#D61F4A' : '#07C5C8';
  $('zap-brilho').style.transform = `translateX(${((t % 2.5) / 2.5) * 700 - 120}px)`;
}

window.render = render;
window.__pronto = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  // a linha "Tem IASEP ou PROASA?" precisa caber em 1140px
  const linha = $('linha');
  let esc = 1; while (linha.offsetWidth > 1140 && esc > 0.5) { esc -= 0.02;
    for (const el of linha.children) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * 0.98) + 'px'; }
  const encaixa = (el, maxW) => { let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > maxW && fs > 20) { fs--; el.style.fontSize = fs + 'px'; } };
  encaixa($('q'), 820); encaixa($('r'), 820);
  for (const id of ['linha', 'carimbo', 'cartao']) { const el = $(id); el._x = (1200 - el.offsetWidth) / 2; el.style.transformOrigin = 'center'; }
  // cena 2: textos à direita do papel da guia (x de 340 a 1180), centralizados nessa área
  for (const id of ['q', 'r']) { const el = $(id); el._x = 760 - el.offsetWidth / 2; el.style.transformOrigin = 'center'; }
  const p1 = $('p1'), p2 = $('p2'), gap = 22, tot = p1.offsetWidth + p2.offsetWidth + gap;
  p1._x = (1200 - tot) / 2; p2._x = p1._x + p1.offsetWidth + gap;
  for (const el of [...linha.children, p1, p2]) el.style.transformOrigin = 'center';
  $('guia').style.transformOrigin = '50% 100%';
  { const b = $('zap').getBoundingClientRect(), f = $('faixa').getBoundingClientRect(); $('zap')._r = { x: b.left - f.left, y: b.top - f.top, w: b.width, h: b.height }; }
  return true;
})();
const q = new URLSearchParams(location.search);
window.__pronto.then(() => {
  if (q.has('render')) return;
  if (q.has('t')) return render(parseFloat(q.get('t')));
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
